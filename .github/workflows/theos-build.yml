name: Theos build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ runner.temp }}/theos

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential dpkg-dev clang make perl ruby curl unzip lsb-release

    - name: Install ldid (optional)
      run: |
        # try apt first
        if ! command -v ldid >/dev/null 2>&1; then
          echo "installing ldid..."
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/2.1.3/ldid || true
          sudo mv /tmp/ldid /usr/local/bin/ldid || true
          sudo chmod +x /usr/local/bin/ldid || true
        else
          echo "ldid already installed"
        fi

    - name: Clone Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git "${THEOS}"

    - name: Prepare THEOS env
      run: |
        echo "THEOS=${THEOS}" >> $GITHUB_ENV
        echo "export THEOS=${THEOS}" >> $GITHUB_ENV

    - name: Download iOS SDK (required)
      env:
        SDK_URL: ${{ secrets.IOS_SDK_URL }}
      run: |
        if [ -z "$SDK_URL" ]; then
          echo "ERROR: No SDK_URL provided. Add a repository secret named IOS_SDK_URL pointing to a tarball of the iPhoneOS<version>.sdk"
          exit 1
        fi
        mkdir -p "${THEOS}/sdks"
        echo "Downloading SDK from $SDK_URL"
        curl -L "$SDK_URL" -o /tmp/sdk.tar.gz
        tar -C "${THEOS}/sdks" -xzf /tmp/sdk.tar.gz || (echo "tar failed, trying unzip" && mkdir -p /tmp/sdk_unpack && tar -tzf /tmp/sdk.tar.gz && exit 1)
        ls -la "${THEOS}/sdks"

    - name: Build package with Theos
      run: |
        # adjust SDKVERSION/ARCHS in Makefile or here if needed
        make package -C "${{ github.workspace }}" || (echo "make failed"; exit 1)

    - name: Find generated .deb
      run: |
        find "${{ github.workspace }}" -type f -name "*.deb" -print > debs.txt || true
        echo "Found debs:" && cat debs.txt || true

    - name: Upload .deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: actiongesture-debs
        path: |
          $(cat debs.txt || true)

    - name: Create GitHub Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        body: "Automated build by GitHub Actions"
        draft: false
        prerelease: false

    - name: Upload .deb assets to Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: |
          $(cat debs.txt || true)
        asset_name: |
          $(basename $(cat debs.txt || true))
        asset_content_type: application/octet-stream
